frontend.workerVersioningDataAPIs:
  - value: true
frontend.workerVersioningWorkflowAPIs:
  - value: true
system.enableDeployments:
  - value: true
system.enableDeploymentVersions:
  - value: true
frontend.workerVersioningRuleAPIs:
  - value: true
component.nexusoperations.callback.endpoint.template:
  - value: http://localhost:7243/namespaces/{{.NamespaceName}}/nexus/callback
callback.allowedAddresses:
  - value:
      - Pattern: "*"
        AllowInsecure: true
matching.queryWorkflowTaskTimeoutLogRate:
  - value: 1.0
history.ReplicationEnableUpdateWithNewTaskMerge:
  - value: true
history.hostLevelCacheMaxSize:
  - value: 8192
# Default is 1 minute, which makes newly-added custom search attributes
# (via `temporal operator search-attribute create`) unusable for up to 60s
# after the RPC returns success — workflow starts referencing the new
# attribute fail with "no mapping defined" until this cache refreshes.
system.clusterMetadataRefreshInterval:
  - value: 1s
system.forceSearchAttributesCacheRefreshOnRead:
  - value: true
