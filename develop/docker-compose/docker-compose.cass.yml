# Cassandra base compose file for development and benchmarks.
# Usage: podman compose -f docker-compose.cass.yml up -d cassandra
#
# Uses host networking to avoid NAT/bridge overhead on CQL traffic.
services:
  cassandra:
    image: cassandra:5.0
    container_name: temporal-dev-cassandra
    network_mode: host
    environment:
      CASSANDRA_LISTEN_ADDRESS: 127.0.0.1
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 100M
