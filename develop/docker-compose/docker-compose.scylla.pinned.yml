# CPU-pinned overlay for ScyllaDB benchmarks.
# Usage: podman compose -f docker-compose.scylla.yml -f docker-compose.scylla.pinned.yml up
services:
  scylladb:
    cpuset: "0,1"
    command: >-
      --smp 2
      --cpuset 0-1
      --memory 1G
      --developer-mode 1
      --listen-address 127.0.0.1
      --rpc-address 127.0.0.1
      --seed-provider-parameters seeds=127.0.0.1
      --unsafe-bypass-fsync=on
      --kernel-page-cache=on
      --commitlog-use-o-dsync=0
      --collectd=0
      --max-networking-io-control-blocks=1000
      --flush-schema-tables-after-modification=false
      --auto-snapshot=0
      --logger-log-level=compaction=warn
      --logger-log-level=migration_manager=warn
      --shutdown-announce-in-ms=0
